<div class="fondo-modal">
  <div class="ventana-modal"
       role="dialog"
       aria-modal="true"
       aria-labelledby="titulo-confirmacion">

    <h3 id="titulo-confirmacion">
      Incidencia enviada exitosamente
    </h3>

    <p>
      Tu incidencia ha sido registrada correctamente.
      Recibirás una respuesta dentro de los próximos
      días hábiles.
    </p>

    <button mat-flat-button
            type="button"
            class="boton-entendido"
            (click)="cerrar()">
      ENTENDIDO
    </button>
  </div>
</div>
