<!-- Formulario visual vacío. No guarda información ni ejecuta solicitudes. -->
<div class="capa-modal">
<section class="ventana-modal" role="dialog" aria-modal="true" aria-labelledby="titulo-editar-perfil">
<button class="boton-cerrar" type="button" aria-label="Cerrar ventana">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="m5 5 14 14M19 5 5 19"/>
</svg>
</button>
<header class="encabezado-modal">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="m16 3 5 5L8 21l-6 1 1-6Zm-2 2 5 5"/>
</svg>
<h1 id="titulo-editar-perfil">Editar información</h1>
</header>
<form class="formulario-modal">
<div class="campo-formulario">
<label for="perfil-editar-nombres">Nombres</label>
<div class="contenedor-entrada">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="7" r="4"/>
<path d="M4 21v-3a8 8 0 0 1 16 0v3"/>
</svg>
<input id="perfil-editar-nombres" name="perfil-editar-nombres" type="text" placeholder="Nombres" autocomplete="given-name" >
</div>
</div>
<div class="campo-formulario">
<label for="perfil-editar-apellidos">Apellidos</label>
<div class="contenedor-entrada">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="7" r="4"/>
<path d="M4 21v-3a8 8 0 0 1 16 0v3"/>
</svg>
<input id="perfil-editar-apellidos" name="perfil-editar-apellidos" type="text" placeholder="Apellidos" autocomplete="family-name" >
</div>
</div>
<div class="fila-campos">
<div class="campo-formulario">
<label for="perfil-editar-dni">DNI</label>
<div class="contenedor-entrada">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="2" y="5" width="20" height="14" rx="2"/>
<circle cx="7" cy="10" r="2"/>
<path d="M4 16a3 3 0 0 1 6 0m3-7h6m-6 4h6m-6 3h3"/>
</svg>
<input id="perfil-editar-dni" name="perfil-editar-dni" type="text" placeholder="DNI"  inputmode="numeric" maxlength="8">
</div>
</div>
<div class="campo-formulario">
<label for="perfil-editar-telefono">Teléfono</label>
<div class="contenedor-entrada">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M22 17v3a2 2 0 0 1-2.2 2A20 20 0 0 1 2 4.2 2 2 0 0 1 4 2h3l2 6-3 2a16 16 0 0 0 8 8l2-3Z"/>
</svg>
<input id="perfil-editar-telefono" name="perfil-editar-telefono" type="tel" placeholder="Teléfono" autocomplete="tel" >
</div>
</div>
</div>
<div class="campo-formulario">
<label for="perfil-editar-correo">Correo electrónico</label>
<div class="contenedor-entrada">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="2" y="4" width="20" height="16" rx="2"/>
<path d="m2 5 10 8L22 5"/>
</svg>
<input id="perfil-editar-correo" name="perfil-editar-correo" type="email" placeholder="Correo electrónico" autocomplete="email" >
</div>
</div>
<div class="acciones-formulario">
<button class="boton " type="button">
<span>Actualizar</span>
</button>
</div>
</form>
</section>
</div>
