<!-- Dos campos de nueva contraseña; validación y envío pendientes de implementación. -->
<div class="capa-modal">
<section class="ventana-modal ventana-contrasena" role="dialog" aria-modal="true" aria-labelledby="titulo-cambiar-contrasena">
<button class="boton-cerrar" type="button" aria-label="Cerrar ventana">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="m5 5 14 14M19 5 5 19"/>
</svg>
</button>
<header class="encabezado-modal">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="7" cy="16" r="5"/>
<path d="m11 12 10-10 3 3-4 4-3-3"/>
</svg>
<h1 id="titulo-cambiar-contrasena">Cambiar contraseña</h1>
</header>
<form class="formulario-modal">
<div class="campo-formulario">
<label for="perfil-nueva-contrasena">Nueva contraseña</label>
<div class="contenedor-entrada">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="4" y="10" width="16" height="12" rx="2"/>
<path d="M8 10V6a4 4 0 0 1 8 0v4"/>
</svg>
<input id="perfil-nueva-contrasena" name="perfil-nueva-contrasena" type="password" placeholder="Nueva contraseña" autocomplete="new-password" >
</div>
</div>
<div class="campo-formulario">
<label for="perfil-repetir-contrasena">Repetir contraseña</label>
<div class="contenedor-entrada">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="4" y="10" width="16" height="12" rx="2"/>
<path d="M8 10V6a4 4 0 0 1 8 0v4"/>
</svg>
<input id="perfil-repetir-contrasena" name="perfil-repetir-contrasena" type="password" placeholder="Repetir contraseña" autocomplete="new-password" >
</div>
</div>
<div class="acciones-formulario">
<button class="boton " type="button">
<span>Cambiar</span>
</button>
</div>
</form>
</section>
</div>
