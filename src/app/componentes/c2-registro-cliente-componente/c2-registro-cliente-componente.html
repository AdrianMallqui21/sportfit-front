<section aria-labelledby="titulo-registro" class="tarjeta-registro">
  <!-- Título -->
  <h1 id="titulo-registro">Registro</h1>

  <!-- Formulario de registro -->
  <form
    (ngSubmit)="onSubmit()"
    [formGroup]="registroCliente"
    class="formulario-registro"
  >
    <!-- Nombres -->
    <label for="registro-nombres">Nombres</label>
    <mat-form-field subscriptSizing="dynamic">
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>person</mat-icon>
      <input
        autocomplete="given-name"
        formControlName="nombres"
        id="registro-nombres"
        matInput
        placeholder="Ingresa tus nombres"
      />
    </mat-form-field>

    <!-- Apellidos -->
    <label for="registro-apellidos">Apellidos</label>
    <mat-form-field subscriptSizing="dynamic">
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>person</mat-icon>
      <input
        autocomplete="family-name"
        formControlName="apellidos"
        id="registro-apellidos"
        matInput
        placeholder="Ingresa tus apellidos"
      />
    </mat-form-field>

    <!-- DNI y teléfono -->
    <div class="fila-documento-contacto">
      <div class="campo">
        <label for="registro-dni">DNI</label>
        <mat-form-field subscriptSizing="dynamic">
          <mat-icon fontSet="material-symbols-outlined" matIconPrefix>badge</mat-icon>
          <input
            formControlName="dni"
            id="registro-dni"
            inputmode="numeric"
            matInput
            placeholder="Ingresa tu DNI"
          />
        </mat-form-field>
      </div>

      <div class="campo">
        <label for="registro-telefono">Teléfono</label>
        <mat-form-field subscriptSizing="dynamic">
          <mat-icon fontSet="material-symbols-outlined" matIconPrefix>call</mat-icon>
          <span matTextPrefix>+51&nbsp;</span>
          <input
            autocomplete="tel-national"
            formControlName="telefono"
            id="registro-telefono"
            matInput
            placeholder="Tu número"
            type="tel"
          />
        </mat-form-field>
      </div>
    </div>

    <!-- Correo electrónico -->
    <label for="registro-correo">Correo electrónico</label>
    <mat-form-field subscriptSizing="dynamic">
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>mail</mat-icon>
      <input
        autocomplete="email"
        formControlName="correo"
        id="registro-correo"
        matInput
        placeholder="Ingresa tu correo electrónico"
        type="email"
      />
    </mat-form-field>

    <!-- Contraseña -->
    <label for="registro-contrasena">Contraseña</label>
    <mat-form-field subscriptSizing="dynamic">
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>lock</mat-icon>
      <input
        [type]="ocultarContrasena() ? 'password' : 'text'"
        autocomplete="new-password"
        formControlName="contrasena"
        id="registro-contrasena"
        matInput
        placeholder="Ingresa tu contraseña"
      />
      <button
        (click)="ocultarContrasena.set(!ocultarContrasena())"
        [attr.aria-label]="ocultarContrasena() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
        matIconButton
        matSuffix
        type="button"
      >
        <mat-icon fontSet="material-symbols-outlined">
          {{ ocultarContrasena() ? 'visibility_off' : 'visibility' }}
        </mat-icon>
      </button>
    </mat-form-field>

    <!-- Repetir contraseña -->
    <label for="registro-confirmacion">Repetir contraseña</label>
    <mat-form-field subscriptSizing="dynamic">
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>lock</mat-icon>
      <input
        [type]="ocultarConfirmacion() ? 'password' : 'text'"
        autocomplete="new-password"
        formControlName="confirmacion"
        id="registro-confirmacion"
        matInput
        placeholder="Repite tu contraseña"
      />
      <button
        (click)="ocultarConfirmacion.set(!ocultarConfirmacion())"
        [attr.aria-label]="ocultarConfirmacion() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
        matIconButton
        matSuffix
        type="button"
      >
        <mat-icon fontSet="material-symbols-outlined">
          {{ ocultarConfirmacion() ? 'visibility_off' : 'visibility' }}
        </mat-icon>
      </button>
    </mat-form-field>

    <!-- Botón de registro -->
    <button matButton="filled" type="submit">Regístrate</button>

    <!-- Volver al inicio de sesión -->
    <a routerLink="/">¿Ya tienes una cuenta? Inicia sesión aquí</a>
  </form>
  
</section>

<!-- Imagen de portada -->
<img alt="" class="portada-registro" src="portada-sportfit.png"/>
