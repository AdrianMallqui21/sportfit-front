<h2 mat-dialog-title class="titulo-exito">Notificación eliminada</h2>

<mat-dialog-content class="mensaje-exito">
  La notificación se eliminó correctamente y ya no aparecerá
  en tu lista de notificaciones.
</mat-dialog-content>

<mat-dialog-actions align="center" class="acciones-exito">
  <button mat-flat-button type="button" class="boton-entendido" [mat-dialog-close]="true">
    Entendido
  </button>
</mat-dialog-actions>
