<div class="formulario-inicio-cliente">

  <!-- Barra de navegación -->
  <!--  -->
  <nav aria-label="Tipo de acceso" class="tipos-acceso">
    <a aria-current="page" class="tipo-acceso tipo-acceso--activo" mat-button routerLink="/">
      <mat-icon fontSet="material-symbols-outlined">person</mat-icon>
      Usuario
    </a>
    <a [routerLink]="'/administrador'" class="tipo-acceso" mat-button>
      <mat-icon fontSet="material-symbols-outlined">verified_user</mat-icon>
      Administrador
    </a>
  </nav>

  <!-- Título y descripción -->
  <header class="encabezado-inicio-sesion">
    <h1 class="titulo-inicio-sesion" id="titulo-inicio-sesion">Iniciar sesión</h1>
    <p class="subtitulo-inicio-sesion">Disfruta del deporte al máximo</p>
  </header>

  <!-- Formulario de inicio de sesión -->
  <form (ngSubmit)="onSubmit()" [formGroup]="loginCliente" class="form-container">
    <!-- Correo electronico -->
    <label for="correo-cliente">Correo electrónico</label>
    <mat-form-field>
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>mail</mat-icon>
      <input formControlName="email" id="correo-cliente" matInput placeholder="Ingresa tu correo electrónico"/>
    </mat-form-field>

    <!-- Contraseña -->
    <label for="contrasena-cliente">Contraseña</label>
    <mat-form-field>
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>lock</mat-icon>
      <input [type]="hide() ? 'password' : 'text'" formControlName="password" id="contrasena-cliente" matInput
             placeholder="Ingresa tu contraseña"/>

      <button
        (click)="clickEvent($event)"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()"
        matIconButton
        matSuffix
        type="button"
      >
        <mat-icon fontSet="material-symbols-outlined">{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <!-- Recordar -->
    <mat-checkbox class="recuerdame-checkboc">Recuerdame</mat-checkbox>

    <!-- Boton de envio -->
    <button matButton="filled" type="submit">
      Acceder
      <mat-icon fontSet="material-symbols-outlined" iconPositionEnd>
        arrow_forward
      </mat-icon>
    </button>

  </form>

  <!-- Logotipo -->
  <img alt="logotipo" src="loge-sportfit.png"/>


  <a [routerLink]="'/registro'">¿No tienes una cuenta? Registrate Aqui</a>

</div>


<img src="portada-sportfit.png"/>
