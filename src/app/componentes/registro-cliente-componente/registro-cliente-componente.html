<div class="pagina-registro">
  <main class="tarjeta-registro">
    <header class="encabezado-registro">
      <h1 id="titulo-registro" class="titulo-registro">
        Registro
      </h1>
    </header>

    <form
      #formularioRegistro
      (submit)="registrarCliente($event, formularioRegistro, confirmacionRegistro)"
      id="formulario-registro"
      class="formulario-registro"
      aria-labelledby="titulo-registro"
    >
      <div class="campo-formulario">
        <label class="etiqueta-campo" for="nombres">
          Nombres
        </label>

        <div class="contenedor-entrada">
          <input
            class="entrada-formulario"
            type="text"
            id="nombres"
            name="nombres"
            placeholder="Ingresa tus nombres"
            autocomplete="given-name"
            required
          >
        </div>
      </div>

      <div class="campo-formulario">
        <label class="etiqueta-campo" for="apellidos">
          Apellidos
        </label>

        <div class="contenedor-entrada">
          <input
            class="entrada-formulario"
            type="text"
            id="apellidos"
            name="apellidos"
            placeholder="Ingresa tus apellidos"
            autocomplete="family-name"
            required
          >
        </div>
      </div>

      <div class="fila-campos">
        <div class="campo-formulario">
          <label class="etiqueta-campo" for="dni">
            DNI
          </label>

          <div class="contenedor-entrada">
            <input
              class="entrada-formulario"
              type="text"
              id="dni"
              name="dni"
              placeholder="Ingresa tu DNI"
              inputmode="numeric"
              pattern="[0-9]{8}"
              minlength="8"
              maxlength="8"
              title="Ingresa los 8 dígitos de tu DNI"
              required
            >
          </div>
        </div>

        <div class="campo-formulario">
          <label class="etiqueta-campo" for="telefono">
            Teléfono
          </label>

          <div class="contenedor-entrada">
            <input
              class="entrada-formulario"
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="Ingresa tu teléfono"
              autocomplete="tel"
              required
            >
          </div>
        </div>
      </div>

      <div class="campo-formulario">
        <label class="etiqueta-campo" for="correo-registro">
          Correo electrónico
        </label>

        <div class="contenedor-entrada">
          <input
            class="entrada-formulario"
            type="email"
            id="correo-registro"
            name="correo"
            placeholder="Ingresa tu correo electrónico"
            autocomplete="email"
            required
          >
        </div>
      </div>

      <div class="campo-formulario">
        <label class="etiqueta-campo" for="contrasena-registro">
          Contraseña
        </label>

        <div class="contenedor-entrada">
          <input
            class="entrada-formulario"
            type="password"
            #contrasenaRegistro
            (input)="validarConfirmacion(contrasenaRegistro, confirmarContrasena)"
            id="contrasena-registro"
            name="contrasena"
            placeholder="Ingresa tu contraseña"
            autocomplete="new-password"
            required
          >

          <!-- Pendiente: agregar la lógica para mostrar la contraseña. -->
          <button
            class="boton-mostrar-contrasena"
            type="button"
            aria-controls="contrasena-registro"
            aria-label="Mostrar contraseña"
          >
            Mostrar
          </button>
        </div>
      </div>

      <div class="campo-formulario">
        <label class="etiqueta-campo" for="confirmar-contrasena">
          Confirmar contraseña
        </label>

        <div class="contenedor-entrada">
          <input
            class="entrada-formulario"
            type="password"
            #confirmarContrasena
            (input)="validarConfirmacion(contrasenaRegistro, confirmarContrasena)"
            id="confirmar-contrasena"
            name="confirmar-contrasena"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
            required
          >

          <!-- Pendiente: agregar la lógica para mostrar la confirmación. -->
          <button
            class="boton-mostrar-contrasena"
            type="button"
            aria-controls="confirmar-contrasena"
            aria-label="Mostrar confirmación de contraseña"
          >
            Mostrar
          </button>
        </div>
      </div>

      <button class="boton-registrarse" type="submit">
        Registrarme
      </button>

      <p class="texto-inicio-sesion">
        ¿Ya tienes una cuenta?

        <!-- Reemplazar "." por la ruta de inicio de sesión. -->
        <a class="enlace-inicio-sesion" routerLink="/">
          Inicia sesión
        </a>
      </p>
    </form>
  </main>

  <div class="contenedor-ilustracion" aria-hidden="true">
    <!-- Reemplazar "." por la ruta de la ilustración de deportistas. -->
    <img
      class="ilustracion-deportistas"
      src="."
      alt=""
    >
  </div>
</div>


<!-- Confirmación de registro C3 dentro del mismo componente, sin ruta adicional. -->
<ng-template #confirmacionRegistro>
  <section class="confirmacion-registro">
    <span class="icono-confirmacion-registro" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 11 4 4L22 4"></path>
        <path d="M21 12a9 9 0 1 1-6-8.5"></path>
      </svg>
    </span>

    <h2 id="titulo-confirmacion-registro" class="titulo-confirmacion-registro">
      ¡Registro completado!
    </h2>

    <p id="descripcion-confirmacion-registro" class="descripcion-confirmacion-registro">
      Tu cuenta fue creada correctamente. Ya puedes acceder a SportFit con tus datos.
    </p>

    <button
      class="boton-iniciar-sesion"
      type="button"
      mat-dialog-close="iniciar-sesion"
    >
      Iniciar sesión
    </button>
  </section>
</ng-template>
