<div class="pagina-registro">
  <main class="tarjeta-registro">
    <header class="encabezado-registro">
      <h1 id="titulo-registro" class="titulo-registro">
        Registro
      </h1>
    </header>

    <form
      #formularioRegistro
      (submit)="registrarCliente($event, formularioRegistro, confirmacionRegistro)"
      id="formulario-registro"
      class="formulario-registro"
      aria-labelledby="titulo-registro"
    >
      <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Nombres</mat-label>
        <input matInput
          class="entrada-formulario"
          type="text"
          id="nombres"
          name="nombres"
          placeholder="Ingresa tus nombres"
          autocomplete="given-name"
          required
        >
      </mat-form-field>

      <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Apellidos</mat-label>
        <input matInput
          class="entrada-formulario"
          type="text"
          id="apellidos"
          name="apellidos"
          placeholder="Ingresa tus apellidos"
          autocomplete="family-name"
          required
        >
      </mat-form-field>

      <div class="fila-campos">
        <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
          <mat-label>DNI</mat-label>
          <input matInput
            class="entrada-formulario"
            type="text"
            id="dni"
            name="dni"
            placeholder="Ingresa tu DNI"
            inputmode="numeric"
            pattern="[0-9]{8}"
            minlength="8"
            maxlength="8"
            title="Ingresa los 8 dígitos de tu DNI"
            required
          >
        </mat-form-field>

        <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
          <mat-label>Teléfono</mat-label>
          <input matInput
            class="entrada-formulario"
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="Ingresa tu teléfono"
            autocomplete="tel"
            required
          >
        </mat-form-field>
      </div>

      <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Correo electrónico</mat-label>
        <input matInput
          class="entrada-formulario"
          type="email"
          id="correo-registro"
          name="correo"
          placeholder="Ingresa tu correo electrónico"
          autocomplete="email"
          required
        >
      </mat-form-field>

      <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Contraseña</mat-label>
        <input matInput
          class="entrada-formulario"
          [type]="mostrarContrasena() ? 'text' : 'password'"
          #contrasenaRegistro
          (input)="validarConfirmacion(contrasenaRegistro, confirmarContrasena)"
          id="contrasena-registro"
          name="contrasena"
          placeholder="Ingresa tu contraseña"
          autocomplete="new-password"
          required
        >

        <button
          mat-button matSuffix class="boton-mostrar-contrasena"
          type="button"
          aria-controls="contrasena-registro"
          (click)="mostrarContrasena.set(!mostrarContrasena())"
          [attr.aria-pressed]="mostrarContrasena()"
          [attr.aria-label]="mostrarContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ mostrarContrasena() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </mat-form-field>

      <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Confirmar contraseña</mat-label>
        <input matInput
          class="entrada-formulario"
          [type]="mostrarConfirmacion() ? 'text' : 'password'"
          #confirmarContrasena
          (input)="validarConfirmacion(contrasenaRegistro, confirmarContrasena)"
          id="confirmar-contrasena"
          name="confirmar-contrasena"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
          required
        >

        <button
          mat-button matSuffix class="boton-mostrar-contrasena"
          type="button"
          aria-controls="confirmar-contrasena"
          (click)="mostrarConfirmacion.set(!mostrarConfirmacion())"
          [attr.aria-pressed]="mostrarConfirmacion()"
          [attr.aria-label]="mostrarConfirmacion() ? 'Ocultar confirmación de contraseña' : 'Mostrar confirmación de contraseña'"
        >
          {{ mostrarConfirmacion() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </mat-form-field>

      @if (errorRegistro()) {
        <p role="alert">{{ errorRegistro() }}</p>
      }
      <button mat-flat-button class="boton-registrarse" type="submit" [disabled]="enviando()">
        Registrarme
      </button>

      <p class="texto-inicio-sesion">
        ¿Ya tienes una cuenta?

        <!-- Reemplazar "." por la ruta de inicio de sesión. -->
        <a class="enlace-inicio-sesion" routerLink="/">
          Inicia sesión
        </a>
      </p>
    </form>
  </main>

  <div class="contenedor-ilustracion" aria-hidden="true">
    <!-- Espacio reservado para la ilustración original. -->
  </div>
</div>


<!-- Confirmación de registro C3 dentro del mismo componente, sin ruta adicional. -->
<ng-template #confirmacionRegistro>
  <section class="confirmacion-registro">
    <span class="icono-confirmacion-registro" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 11 4 4L22 4"></path>
        <path d="M21 12a9 9 0 1 1-6-8.5"></path>
      </svg>
    </span>

    <h2 id="titulo-confirmacion-registro" class="titulo-confirmacion-registro">
      ¡Registro completado!
    </h2>

    <p id="descripcion-confirmacion-registro" class="descripcion-confirmacion-registro">
      Tu cuenta fue creada correctamente. Ya puedes acceder a SportFit con tus datos.
    </p>

    <button
      class="boton-iniciar-sesion"
      type="button"
      mat-dialog-close="iniciar-sesion"
    >
      Iniciar sesión
    </button>
  </section>
</ng-template>
