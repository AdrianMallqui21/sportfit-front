<div class="dialogo-contenedor">
  <div class="cabecera-dialogo">
    <div class="titulo-con-icono">
      <mat-icon color="warn">person_off</mat-icon>
      <h2>{{ cliente.activo ? 'Desactivar usuario' : 'Activar usuario' }}</h2>
    </div>
    <button mat-icon-button type="button" [mat-dialog-close]="null" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="cuerpo-desactivar">
    <p class="texto-confirmacion">
      ¿Estás seguro que deseas {{ cliente.activo ? 'desactivar' : 'activar' }} la cuenta de
      <strong>{{ cliente.nombre }} {{ cliente.apellido }}</strong>?
    </p>

    @if (errorCambio()) {
      <p class="texto-error">{{ errorCambio() }}</p>
    }

    <div class="acciones-dialogo">
      <button mat-stroked-button type="button" [mat-dialog-close]="null">Cancelar</button>
      <button mat-flat-button
              type="button"
              [class.btn-desactivar]="cliente.activo"
              [class.btn-activar]="!cliente.activo"
              [disabled]="procesando()"
              (click)="confirmarCambioEstado()">
        {{ procesando() ? 'PROCESANDO...' : (cliente.activo ? 'DESACTIVAR' : 'ACTIVAR') }}
      </button>
    </div>
  </mat-dialog-content>
</div>
