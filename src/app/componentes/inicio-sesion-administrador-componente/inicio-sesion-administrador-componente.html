<div class="pagina-inicio-sesion">
  <main class="tarjeta-inicio-sesion">
    <nav class="tipos-acceso" aria-label="Tipo de acceso">
      <a class="tipo-acceso" routerLink="/">
        Usuario
      </a>

      <a
        class="tipo-acceso tipo-acceso--activo"
        routerLink="/administrador"
        aria-current="page"
      >
        Administrador
      </a>
    </nav>

    <header class="encabezado-inicio-sesion">
      <h1 id="titulo-acceso-administrador" class="titulo-inicio-sesion">
        Iniciar sesión
      </h1>

      <p class="subtitulo-inicio-sesion">
        Gestiona el deporte al máximo
      </p>
    </header>

    <form [formGroup]="formulario" (ngSubmit)="onSubmit()"
      id="formulario-acceso-administrador"
      class="formulario-inicio-sesion"
      aria-labelledby="titulo-acceso-administrador"
    >
      <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Correo electrónico</mat-label>
        <input matInput
          class="entrada-formulario"
          type="email"
          id="correo-administrador"
          name="correo" formControlName="correo"
          placeholder="Ingresa tu correo electrónico"
          autocomplete="username"
          required
        >
      </mat-form-field>

      <mat-form-field class="campo-formulario" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Contraseña</mat-label>
        <input matInput
          class="entrada-formulario"
          [type]="mostrarContrasena() ? 'text' : 'password'"
          id="contrasena-administrador"
          name="contrasena" formControlName="contrasena"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >

        <button
          mat-button matSuffix class="boton-mostrar-contrasena"
          type="button"
          aria-controls="contrasena-administrador"
          (click)="mostrarContrasena.set(!mostrarContrasena())"
          [attr.aria-pressed]="mostrarContrasena()"
          [attr.aria-label]="mostrarContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ mostrarContrasena() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </mat-form-field>

      <div class="opciones-inicio-sesion">
        <mat-checkbox class="opcion-recordarme" name="recordarme" formControlName="recordarme">Recordarme</mat-checkbox>

        <!-- Reemplazar "." por la ruta de recuperación de contraseña. -->
        <a class="enlace-recuperar-contrasena" href=".">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <div class="contenedor-logotipo">
        <span class="logotipo">SportFit</span>
      </div>

      @if (mensajeError()) {
        <p role="alert">{{ mensajeError() }}</p>
      }
      <button mat-flat-button class="boton-acceder" type="submit" [disabled]="enviando()">
        Acceder
        <span aria-hidden="true">→</span>
      </button>

      <div class="separador">
        <span>o</span>
      </div>

      <!-- Pendiente: conectar el acceso con Google. -->
      <button mat-stroked-button class="boton-google" type="button">
        <span class="simbolo-google" aria-hidden="true">G</span>
        Continuar con Google
      </button>
    </form>
  </main>

  <div class="contenedor-ilustracion" aria-hidden="true">
    <!-- Espacio reservado para la ilustración original. -->
  </div>
</div>
