<div class="formulario-inicio-administrador">
  <!-- Barra de navegación -->
  <nav aria-label="Tipo de acceso" class="tipos-acceso">
    <a class="tipo-acceso" mat-button routerLink="/login">
      <mat-icon fontSet="material-symbols-outlined">person</mat-icon>
      Usuario
    </a>
    <a aria-current="page" class="tipo-acceso tipo-acceso--activo" mat-button routerLink="/administrador">
      <mat-icon fontSet="material-symbols-outlined">verified_user</mat-icon>
      Administrador
    </a>
  </nav>

  <!-- Título y descripción -->
  <header class="encabezado-inicio-sesion">
    <h1 class="titulo-inicio-sesion">Iniciar sesión</h1>
    <p class="subtitulo-inicio-sesion">Disfruta del deporte al máximo</p>
  </header>

  <!-- Formulario de inicio de sesión -->
  <form (ngSubmit)="onSubmit()" [formGroup]="loginAdministrador" class="form-container">
    <!-- Correo electrónico -->
    <label for="correo-administrador">Correo electrónico</label>
    <mat-form-field>
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>mail</mat-icon>
      <input autocomplete="username" formControlName="email" id="correo-administrador" matInput placeholder="Ingresa tu correo electrónico"
             type="email"/>
    </mat-form-field>

    <!-- Contraseña -->
    <label for="contrasena-administrador">Contraseña</label>
    <mat-form-field>
      <mat-icon fontSet="material-symbols-outlined" matIconPrefix>lock</mat-icon>
      <input [type]="hide() ? 'password' : 'text'" autocomplete="current-password" formControlName="password" id="contrasena-administrador"
             matInput placeholder="Ingresa tu contraseña"/>
      <button (click)="clickEvent($event)" [attr.aria-label]="hide() ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="!hide()" matIconButton
              matSuffix
              type="button">
        <mat-icon fontSet="material-symbols-outlined">{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <!-- Recordar -->
    <mat-checkbox class="recuerdame-checkboc">Recordarme</mat-checkbox>


    <!-- Logotipo -->
    <img alt="SportFit" src="loge-sportfit.png"/>

    <!-- Botón de acceso -->
    <button matButton="filled" type="submit">
      Acceder
      <mat-icon fontSet="material-symbols-outlined" iconPositionEnd>arrow_forward</mat-icon>
    </button>
  </form>
</div>

<!-- Imagen de portada -->
<img alt="" src="portada-sportfit.png"/>
