<!-- Confirmación visual: no actualiza reservas ni ejecuta acciones. -->
<div class="capa-modal">
<section class="ventana-modal ventana-confirmacion" role="dialog" aria-modal="true" aria-labelledby="titulo-confirmar-edicion" aria-describedby="mensaje-confirmar-edicion">
<button class="boton-cerrar" type="button" aria-label="Cerrar ventana">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="m5 5 14 14M19 5 5 19"/>
</svg>
</button>
<header class="encabezado-modal">
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="m16 3 5 5L8 21l-6 1 1-6Zm-2 2 5 5"/>
</svg>
<h1 id="titulo-confirmar-edicion">Editar información</h1>
</header>
<p class="mensaje-confirmacion" id="mensaje-confirmar-edicion">¿Estás seguro de que deseas actualizar la información de la reserva?</p>
<div class="acciones-confirmacion">
<button class="boton boton--rojo" type="button">
<span>Cancelar</span>
</button>
<button class="boton " type="button">
<span>Continuar</span>
</button>
</div>
</section>
</div>
