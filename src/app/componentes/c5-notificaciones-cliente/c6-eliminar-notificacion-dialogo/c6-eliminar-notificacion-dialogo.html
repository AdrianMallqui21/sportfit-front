<h2 mat-dialog-title class="titulo-eliminar">¿Eliminar esta notificación?</h2>

<mat-dialog-content class="mensaje-eliminar">
  Esta notificación se eliminará permanentemente y no podrás recuperarla.
  ¿Deseas continuar?
</mat-dialog-content>

<mat-dialog-actions align="center" class="acciones-eliminar">
  <button mat-flat-button class="boton-no" [mat-dialog-close]="false">No</button>
  <button mat-flat-button class="boton-si" [mat-dialog-close]="true">Sí</button>
</mat-dialog-actions>
