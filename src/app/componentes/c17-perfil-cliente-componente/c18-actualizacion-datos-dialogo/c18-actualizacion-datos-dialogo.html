<h2 mat-dialog-title class="titulo-dialogo">
  Actualización completada
</h2>

<mat-dialog-content class="mensaje-dialogo">
  Tus datos han sido modificados exitosamente y estarán disponibles en tu próxima sesión.
</mat-dialog-content>

<mat-dialog-actions align="center" class="acciones-dialogo">
  <button mat-flat-button
          type="button"
          class="boton-entendido"
          (click)="cerrar()">
    ENTENDIDO
  </button>
</mat-dialog-actions>
